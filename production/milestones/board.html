<title>마왕성 인사팀 마일스톤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style id="css">
/* 레이아웃: 마일스톤 7개를 가로로, 갈래(아트·기획·코드)를 가로 띠로 맞춘 일정판. 카드는 끌어서 옮긴다 */
:root{
  --bg:#e9ece6; --panel:#f6f7f3; --card:#ffffff; --ink:#1c2330; --muted:#5b6470; --line:#c7ccc2;
  --art:#9a5a16; --plan:#2a4c86; --code:#2b7360;
  --ok:#3b7647; --tight:#a8730f; --over:#b2261d;
  --display:"Nanum Myeongjo","Batang",serif;
  --body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121719; --panel:#1a2125; --card:#20292e; --ink:#e2e6e0; --muted:#98a1a7; --line:#2f393e;
    --art:#dd9a52; --plan:#86a8e4; --code:#62c2a0;
    --ok:#6dbf7e; --tight:#e2ae48; --over:#f06a60; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121719; --panel:#1a2125; --card:#20292e; --ink:#e2e6e0; --muted:#98a1a7; --line:#2f393e;
  --art:#dd9a52; --plan:#86a8e4; --code:#62c2a0;
  --ok:#6dbf7e; --tight:#e2ae48; --over:#f06a60; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;padding-block:20px 40px;padding-inline:16px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.top h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;text-wrap:balance;letter-spacing:-.01em}
.top .sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls button{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.controls button.primary{background:var(--plan);border-color:var(--plan);color:var(--card);font-weight:600}
.controls button:disabled{opacity:.45;cursor:default}
.status{font-size:12.5px;color:var(--muted);min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);margin:0 0 14px;padding:0;list-style:none}
.legend b{color:var(--ink);font-weight:600}
.board-wrap{overflow-x:auto;padding-bottom:8px}
.board{display:grid;grid-template-columns:repeat(7,minmax(232px,1fr));gap:10px 10px;min-width:max-content}
.mhead{padding:10px 10px 8px;border-bottom:2px solid var(--ink)}
.mhead .mid{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.mhead h2{font-family:var(--display);font-size:18px;font-weight:800;margin:2px 0 4px;text-wrap:balance}
.mhead .range{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.mhead .split{font-size:12px;color:var(--muted);margin-top:2px}
.mhead .q{margin:6px 0 0;font-size:12.5px}
.mhead .q::before{content:"끝날 때 · ";color:var(--muted)}
.mhead .mnote{margin:4px 0 0;font-size:12px;color:var(--muted)}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px}
.cell.lane-a{--lane:var(--art)} .cell.lane-p{--lane:var(--plan)} .cell.lane-c{--lane:var(--code)}
.cell.over-target{border-color:var(--lane);box-shadow:0 0 0 1px var(--lane) inset}
.lhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lname{font-weight:600;color:var(--lane);font-size:13px;letter-spacing:.04em}
.load{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.load b{font-weight:500;color:var(--ink)}
.load.tight b{color:var(--tight)} .load.over b{color:var(--over)}
.load.over::after{content:" 넘침";font-family:var(--body);color:var(--over);font-weight:600}
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.tight i{background:var(--tight)} .meter.over i{background:var(--over)}
.here{font:inherit;font-size:11.5px;padding:1px 8px;border-radius:10px;border:1px solid var(--lane);background:transparent;color:var(--lane);cursor:pointer}
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;min-height:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:6px 6px 6px 8px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;cursor:grab;user-select:none}
.card.est{border-style:dashed}
.card.changed{border-color:var(--tight);border-style:solid;box-shadow:0 0 0 1px var(--tight) inset}
.card.sel{border-color:var(--lane);border-style:solid;box-shadow:0 0 0 2px var(--lane) inset}
.card.dragging{opacity:.4}
.card .t{min-width:0;font-size:13px;overflow-wrap:anywhere}
.card .from{font-family:var(--mono);font-size:11px;color:var(--lane);white-space:nowrap}
.card .cn{display:block;font-size:11.5px;color:var(--muted)}
.card .d,.card .d-in{flex:none;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;min-width:30px;text-align:center;padding:1px 6px;border-radius:4px;border:1px solid transparent;background:var(--bg);color:var(--ink);cursor:pointer}
.card .d:hover{border-color:var(--lane)}
.card .d-in{width:56px;border-color:var(--lane)}
.drop-mark{height:3px;border-radius:2px;background:var(--lane);list-style:none}
.foot{margin-top:16px;font-size:12.5px;color:var(--muted);max-width:70ch}
.foot p{margin:4px 0}
#textout{width:100%;min-height:160px;margin-top:10px;font-family:var(--mono);font-size:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
button:focus-visible,.card:focus-visible{outline:2px solid var(--plan);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script id="app">
(function () {
  // 판의 원본 상태 (저장된 판). 되돌리기와 저장의 기준이 된다
  var BASE = JSON.parse(document.getElementById('state').textContent);
  var state = JSON.parse(JSON.stringify(BASE));
  var LANES = [{ k: 'a', name: '아트' }, { k: 'p', name: '기획' }, { k: 'c', name: '코드' }];
  var moved = new Set();   // 저장 안 한 변경이 있는 카드
  var dirty = false, readOnly = false, selected = null;
  var ns = null, nsState = 'pending';   // artifact 저장 기능: pending | ready | none

  // 저장할 때 페이지를 다시 만들기 위한 원본 조각 (실행 중인 화면이 아니라 처음 쓰인 글)
  var CSS = document.getElementById('css').textContent;
  var APP = document.getElementById('app').textContent;
  var FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">';
  var RESET = (function () {
    var list = document.head ? document.head.querySelectorAll('style') : [];
    for (var i = 0; i < list.length; i++) {
      var t = list[i].textContent || '';
      if (t.indexOf('safe-area-inset') >= 0) return t;
    }
    return ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}';
  })();

  var root = document.getElementById('root');
  root.innerHTML =
    '<header class="top"><div><h1>데모까지 마일스톤 일곱 개</h1>' +
    '<p class="sub">2026-10-02 살펴보기 ②-가에서 정한 그림 · 제출 2027-04-15 · 주 6일로 센 날 수</p></div>' +
    '<div class="controls"><button type="button" id="save" class="primary">저장</button>' +
    '<button type="button" id="discard">저장 안 한 변경 버리기</button>' +
    '<button type="button" id="copy">글로 복사</button>' +
    '<span class="status" id="status" aria-live="polite"></span></div></header>' +
    '<ul class="legend">' +
    '<li><b>끌어서 옮기기</b> 카드를 다른 칸이나 순서로 끌어다 놓습니다. 끌기가 안 되면 카드를 누르고 옮길 칸의 「여기로」를 누릅니다</li>' +
    '<li><b>숫자</b> 그 일에 드는 날 수. 누르면 고칠 수 있습니다</li>' +
    '<li><b>점선 테두리</b> Claude가 어림한 날 수 (할 일 목록이 아직 없는 마일스톤)</li>' +
    '<li><b>← M03</b> 그 마일스톤에서 당겨 온 일</li></ul>' +
    '<div class="board-wrap"><div class="board" id="board"></div></div>' +
    '<div class="foot"><p>칸 위의 「13 / 23일」은 그 갈래에 들어간 날 수와 마일스톤의 날 수입니다. 갈래마다 하루에 한 칸씩 쓴다고 보고 셉니다. 하루 시간 나누기(뽀모도로)가 마일스톤마다 달라서 비교는 어림입니다.</p>' +
    '<p>저장하면 이 판이 새 판으로 바뀌고, Claude가 나중에 읽어 마일스톤 파일에 옮길 수 있습니다.</p>' +
    '<textarea id="textout" hidden readonly aria-label="복사할 글"></textarea></div>';

  var board = document.getElementById('board');
  var saveBtn = document.getElementById('save');
  var discardBtn = document.getElementById('discard');
  var copyBtn = document.getElementById('copy');
  var statusEl = document.getElementById('status');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmt(n) { n = +n || 0; return String(Math.round(n * 10) / 10); }
  function byId(id) { for (var i = 0; i < state.cards.length; i++) if (state.cards[i].id === id) return state.cards[i]; return null; }
  function sumOf(m, l) { return state.cards.filter(function (c) { return c.m === m && c.l === l; }).reduce(function (a, c) { return a + (+c.d || 0); }, 0); }

  function cardHTML(c) {
    var cls = 'card' + (c.est ? ' est' : '') + (moved.has(c.id) ? ' changed' : '') + (selected === c.id ? ' sel' : '');
    return '<li class="' + cls + '" draggable="true" tabindex="0" data-id="' + esc(c.id) + '">' +
      '<span class="t">' + esc(c.t) + (c.from ? ' <span class="from">' + esc(c.from) + '</span>' : '') +
      (c.n ? '<span class="cn">' + esc(c.n) + '</span>' : '') + '</span>' +
      '<button type="button" class="d" data-id="' + esc(c.id) + '" title="날 수 고치기">' + fmt(c.d) + '</button></li>';
  }

  function render() {
    var h = '';
    state.milestones.forEach(function (m, i) {
      var col = i + 1;
      h += '<section class="mhead" style="grid-column:' + col + ';grid-row:1">' +
        '<div class="mid">' + esc(m.id) + '</div><h2>' + esc(m.name) + '</h2>' +
        '<div class="range">' + esc(m.range) + ' · ' + (m.dn ? esc(m.dn) + ' ' : '') + m.days + '일</div>' +
        (m.split ? '<div class="split">하루 = ' + esc(m.split) + '</div>' : '') +
        '<p class="q">' + esc(m.q) + '</p>' + (m.note ? '<p class="mnote">' + esc(m.note) + '</p>' : '') + '</section>';
      LANES.forEach(function (L, j) {
        var cards = state.cards.filter(function (c) { return c.m === m.id && c.l === L.k; });
        var sum = sumOf(m.id, L.k), pct = m.days ? sum / m.days : 0;
        var lv = pct > 1 ? 'over' : pct > 0.85 ? 'tight' : 'ok';
        var sel = selected ? byId(selected) : null;
        var showHere = sel && !(sel.m === m.id && sel.l === L.k);
        h += '<div class="cell lane-' + L.k + '" data-m="' + m.id + '" data-l="' + L.k + '" style="grid-column:' + col + ';grid-row:' + (j + 2) + '">' +
          '<div class="lhead"><span class="lname">' + L.name + '</span>' +
          (showHere ? '<button type="button" class="here">여기로</button>' : '') +
          '<span class="load ' + lv + '"><b>' + fmt(sum) + '</b> / ' + m.days + '일</span></div>' +
          '<div class="meter ' + lv + '"><i style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></i></div>' +
          '<ul class="cards">' + cards.map(cardHTML).join('') + '</ul></div>';
      });
    });
    board.innerHTML = h;
    updateControls();
  }

  function setStatus(t) { statusEl.textContent = t; }
  function updateControls() {
    saveBtn.disabled = !dirty || readOnly || nsState !== 'ready';
    discardBtn.disabled = !dirty;
    if (readOnly) setStatus('보기 전용입니다. 이 화면에서는 저장할 수 없습니다');
    else if (dirty) setStatus('저장 안 한 변경 ' + moved.size + '개' + (nsState === 'none' ? ' · 이 화면에는 저장 기능이 없습니다 (「글로 복사」를 쓰세요)' : ''));
    else if (nsState === 'none') setStatus('이 화면에는 저장 기능이 없습니다. 옮겨 보기만 됩니다');
    else if (state.savedAt) setStatus('마지막 저장 ' + state.savedAt.slice(0, 16).replace('T', ' '));
    else setStatus('처음 그림 그대로입니다');
  }

  // 카드를 옮긴다: beforeId 앞에, 없으면 그 칸의 맨 끝에
  function moveCard(id, m, l, beforeId) {
    var arr = state.cards, i = arr.findIndex(function (c) { return c.id === id; });
    if (i < 0) return;
    var c = arr.splice(i, 1)[0];
    c.m = m; c.l = l;
    var at = -1;
    if (beforeId && beforeId !== id) at = arr.findIndex(function (x) { return x.id === beforeId; });
    if (at < 0) {
      var last = -1;
      arr.forEach(function (x, k) { if (x.m === m && x.l === l) last = k; });
      at = last >= 0 ? last + 1 : arr.length;
    }
    arr.splice(at, 0, c);
    moved.add(id); dirty = true; selected = null;
    render();
  }

  // 끌어서 옮기기
  var dragId = null, mark = document.createElement('li');
  mark.className = 'drop-mark';
  function beforeCard(ul, y) {
    var items = ul.querySelectorAll('.card:not(.dragging)');
    for (var i = 0; i < items.length; i++) {
      var r = items[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) return items[i];
    }
    return null;
  }
  function clearTargets() { board.querySelectorAll('.cell.over-target').forEach(function (x) { x.classList.remove('over-target'); }); }
  board.addEventListener('dragstart', function (e) {
    var c = e.target.closest && e.target.closest('.card');
    if (!c) return;
    dragId = c.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {}
    c.classList.add('dragging');
  });
  board.addEventListener('dragend', function () {
    dragId = null; mark.remove(); clearTargets();
    board.querySelectorAll('.dragging').forEach(function (x) { x.classList.remove('dragging'); });
  });
  board.addEventListener('dragover', function (e) {
    if (!dragId) return;
    var cell = e.target.closest && e.target.closest('.cell');
    if (!cell) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    var ul = cell.querySelector('.cards'), before = beforeCard(ul, e.clientY);
    if (before) ul.insertBefore(mark, before); else ul.appendChild(mark);
    if (!cell.classList.contains('over-target')) { clearTargets(); cell.classList.add('over-target'); }
  });
  board.addEventListener('drop', function (e) {
    if (!dragId) return;
    var cell = e.target.closest && e.target.closest('.cell');
    if (!cell) return;
    e.preventDefault();
    var next = mark.nextElementSibling;
    while (next && !(next.classList.contains('card') && !next.classList.contains('dragging'))) next = next.nextElementSibling;
    var id = dragId;
    dragId = null; mark.remove(); clearTargets();
    moveCard(id, cell.dataset.m, cell.dataset.l, next ? next.dataset.id : null);
  });

  // 누르기: 날 수 고치기 / 카드 고르기 / 여기로 옮기기
  board.addEventListener('click', function (e) {
    var d = e.target.closest('button.d');
    if (d) { editDays(d); return; }
    var here = e.target.closest('button.here');
    if (here && selected) { var cell = here.closest('.cell'); moveCard(selected, cell.dataset.m, cell.dataset.l, null); return; }
    var card = e.target.closest('.card');
    if (card) { selected = selected === card.dataset.id ? null : card.dataset.id; render(); }
  });
  board.addEventListener('keydown', function (e) {
    var card = e.target.closest && e.target.closest('.card');
    if (card && (e.key === 'Enter' || e.key === ' ') && e.target === card) {
      e.preventDefault(); selected = selected === card.dataset.id ? null : card.dataset.id; render();
    }
  });

  function editDays(btn) {
    var c = byId(btn.dataset.id);
    if (!c) return;
    var inp = document.createElement('input');
    inp.type = 'number'; inp.min = '0'; inp.step = '0.5'; inp.value = c.d; inp.className = 'd-in';
    inp.id = 'days-' + c.id; inp.setAttribute('aria-label', c.t + ' 날 수');
    btn.replaceWith(inp); inp.focus(); inp.select();
    var done = false;
    function commit(ok) {
      if (done) return; done = true;
      if (ok) {
        var v = parseFloat(inp.value);
        if (isFinite(v) && v >= 0 && v !== c.d) { c.d = v; c.est = false; moved.add(c.id); dirty = true; }
      }
      render();
    }
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') commit(true); if (ev.key === 'Escape') commit(false); });
    inp.addEventListener('blur', function () { commit(true); });
  }

  discardBtn.addEventListener('click', function () {
    state = JSON.parse(JSON.stringify(BASE)); moved.clear(); dirty = false; selected = null; render();
  });

  function asText() {
    var out = [];
    state.milestones.forEach(function (m) {
      out.push(m.id + ' ' + m.name + ' (' + m.range + ', ' + m.days + '일)');
      LANES.forEach(function (L) {
        out.push('  ' + L.name + ' ' + fmt(sumOf(m.id, L.k)) + '/' + m.days);
        state.cards.filter(function (c) { return c.m === m.id && c.l === L.k; }).forEach(function (c) {
          out.push('    - ' + c.t + ' (' + fmt(c.d) + (c.est ? ' 어림' : '') + ')');
        });
      });
    });
    return out.join('\n');
  }
  copyBtn.addEventListener('click', function () {
    var t = asText(), box = document.getElementById('textout');
    function show() { box.value = t; box.hidden = false; box.focus(); box.select(); setStatus('아래 글을 선택해 두었습니다. 복사해서 대화창에 붙여 넣으세요'); }
    try {
      navigator.clipboard.writeText(t).then(function () { setStatus('글로 복사했습니다. 대화창에 붙여 넣으면 됩니다'); }, show);
    } catch (_) { show(); }
  });

  // 저장: 지금 상태로 페이지 전체를 다시 만들어 새 판으로 올린다
  function buildDoc(s) {
    var json = JSON.stringify(s).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '<\/style></head><body>' +
      '<title>' + esc(document.title || '마왕성 인사팀 마일스톤') + '</title>\n' + FONTS + '\n<style id="css">' + CSS + '<\/style>\n<main id="root"></main>\n' +
      '<script type="application/json" id="state">' + json + '<\/script>\n<script id="app">' + APP + '<\/script></body></html>';
  }
  saveBtn.addEventListener('click', function () {
    if (!ns || !dirty || readOnly) return;
    var s = JSON.parse(JSON.stringify(state));
    s.savedAt = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString();
    saveBtn.disabled = true; setStatus('저장하는 중');
    ns.publish(buildDoc(s)).then(function () {
      setStatus('저장했습니다. 새 판으로 다시 불러옵니다');
    }, function (err) {
      var code = err && err.code;
      if (code === 'conflict') setStatus('다른 곳에서 먼저 저장한 판이 있어 그 판으로 다시 불러옵니다');
      else if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].indexOf(code) >= 0) { readOnly = true; updateControls(); }
      else if (code === 'rate_limited') { setStatus('저장이 너무 잦습니다. 잠시 뒤 다시 눌러 주세요'); saveBtn.disabled = false; }
      else { setStatus('저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요'); saveBtn.disabled = false; }
    });
  });

  render();
  var cl = window.claude;
  if (cl && typeof cl.use === 'function') {
    cl.use('artifact').then(function (x) { ns = x; nsState = x ? 'ready' : 'none'; updateControls(); }, function () { nsState = 'none'; updateControls(); });
  } else { nsState = 'none'; updateControls(); }
})();
</script>
